<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4 - Product Information</title>
    <style>
        table {
            border-collapse: collapse;
            width: 70%;
        }
        table, th, td {
            border: 1px solid black;
        }
        th, td {
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #dcdcdc;
        }
    </style>
</head>
<body>
    <h2>Welcome to CADT Shop!</h2>

    <table>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>In Stock</th>
            <th>Thumbnail</th>
        </tr>
        <tr>
            <td>C# Book</td>
            <td>$10</td>
            <td>5</td>
            <td>YES</td>
            <td><img src="https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=100" alt="C# Book" width="50"></td>
        </tr>
        <tr>
            <td>CADT Polo</td>
            <td>$12</td>
            <td>60</td>
            <td>YES</td>
            <td><img src="https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=100" alt="CADT Polo" width="50"></td>
        </tr>
        <tr>
            <td>CADT mouse</td>
            <td>$100</td>
            <td>3</td>
            <td>NO</td>
            <td><img src="https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=100" alt="CADT mouse" width="50"></td>
        </tr>
    </table>
</body>
</html>
